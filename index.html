<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Interval Timer</title>

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Interval Timer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
  :root {
    --bg: #0f172a;
    --panel: #16213b;
    --accent: #38bdf8;
    --accent-2: #34d399;
    --text: #e5edf5;
    --muted: #8aa0b8;
    --danger: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 20px) 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
    min-height: 100%;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin: 12px 0 20px;
    text-transform: uppercase;
  }
  .display {
    width: 100%;
    max-width: 420px;
    text-align: center;
    margin-bottom: 24px;
  }
  .state-label {
    font-size: 0.95rem;
    color: var(--muted);
    min-height: 1.3em;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .clock {
    font-size: 4.2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .clock.leadin {
    color: var(--accent-2);
    font-size: 6rem;
  }
  .progress-wrap {
    width: 100%;
    max-width: 420px;
    height: 8px;
    background: #1e293b;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s linear;
  }
  .controls {
    display: flex;
    gap: 14px;
    margin-bottom: 28px;
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    padding: 16px 28px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    color: #04121f;
    background: var(--accent);
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.96); }
  button.secondary {
    background: #22314d;
    color: var(--text);
  }
  button.danger {
    background: var(--danger);
    color: #2a0a0a;
  }
  button:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border-radius: 18px;
    padding: 18px 20px 8px;
  }
  .panel h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 14px;
    font-weight: 600;
  }
  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
  }
  .field label {
    font-size: 0.95rem;
    color: var(--text);
    display: block;
  }
  .field .hint {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Stepper control */
  .stepper {
    display: flex;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
    background: #0c1526;
    border: 1px solid #2a3b57;
    border-radius: 12px;
    overflow: hidden;
  }
  .step-btn {
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 0;
    background: #16233c;
    color: var(--accent);
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-btn:active { background: #1e2f4e; transform: none; }
  .step-btn:disabled { opacity: 0.3; }
  .step-value {
    min-width: 58px;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
  }

  footer {
    margin-top: auto;
    padding-top: 24px;
    font-size: 0.72rem;
    color: var(--muted);
    text-align: center;
  }
  .unlock-note {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    max-width: 380px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Interval Timer</h1>

<div class="display">
  <div class="state-label" id="stateLabel">Ready</div>
  <div class="clock" id="clock">00:00</div>
</div>

<div class="progress-wrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="controls">
  <button id="startBtn">Start</button>
  <button id="stopBtn" class="danger" disabled>Stop</button>
</div>

<div class="panel">
  <h2>Settings</h2>

  <div class="field">
    <div>
      <label>Announce every</label>
      <span class="hint">seconds (0, 5, 10, 15…)</span>
    </div>
    <div class="stepper" id="intervalStepper">
      <button type="button" class="step-btn" data-action="dec" aria-label="Decrease">−</button>
      <div class="step-value" id="intervalValueDisplay">5</div>
      <button type="button" class="step-btn" data-action="inc" aria-label="Increase">+</button>
    </div>
  </div>

  <div class="field">
    <div>
      <label>Session length</label>
      <span class="hint">minutes — gong plays at the end</span>
    </div>
    <div class="stepper" id="durationStepper">
      <button type="button" class="step-btn" data-action="dec" aria-label="Decrease">−</button>
      <div class="step-value" id="durationValueDisplay">1</div>
      <button type="button" class="step-btn" data-action="inc" aria-label="Increase">+</button>
    </div>
  </div>

  <div class="field">
    <div>
      <label>Lead-in</label>
      <span class="hint">beeps before counting starts</span>
    </div>
    <div class="stepper" id="leadInStepper">
      <button type="button" class="step-btn" data-action="dec" aria-label="Decrease">−</button>
      <div class="step-value" id="leadInValueDisplay">3</div>
      <button type="button" class="step-btn" data-action="inc" aria-label="Increase">+</button>
    </div>
  </div>

</div>

<div class="unlock-note" id="unlockNote">Tap Start once to enable sound on this device.</div>

<footer>Works offline once loaded &middot; Add to Home Screen for the full-screen app.</footer>

<!-- Silent looping audio track. iOS Safari silences the Web Audio API
     whenever the phone's ring/silent switch is set to silent, unless the
     page has an active HTML media-element playback session. Playing this
     (inaudible) loop on the first tap flips the page into that "playback"
     audio category so the beeps/gong below are heard even with the phone
     switched to silent. -->
<audio id="silentLoop" loop playsinline preload="auto" style="display:none">
  <source src="data:audio/wav;base64,UklGRuQSAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YcASAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" type="audio/wav">
</audio>

<script>
(function () {
  "use strict";

  // ---------- Elements ----------
  const clockEl = document.getElementById("clock");
  const stateLabelEl = document.getElementById("stateLabel");
  const progressBarEl = document.getElementById("progressBar");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const unlockNote = document.getElementById("unlockNote");

  // ---------- Persisted settings ----------
  const STORAGE_KEY = "interval-timer-settings-v2";
  function loadStoredSettings() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function saveStoredSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        intervalSec: intervalSec,
        maxDurationMin: maxDurationMin,
        leadInSec: leadInSec
      }));
    } catch (e) {}
  }
  const stored = loadStoredSettings();

  // ---------- Stepper control factory ----------
  function trimNumber(v, decimals) {
    return Number.isInteger(v) ? String(v) : v.toFixed(decimals);
  }

  function makeStepper({ containerId, displayId, min, max, step, decimals, initial, onChange }) {
    const container = document.getElementById(containerId);
    const displayEl = document.getElementById(displayId);
    const decBtn = container.querySelector('[data-action="dec"]');
    const incBtn = container.querySelector('[data-action="inc"]');
    let value = Math.min(max, Math.max(min, initial));
    let sessionEnabled = true;

    function render() {
      displayEl.textContent = trimNumber(value, decimals);
      decBtn.disabled = !sessionEnabled || value <= min;
      incBtn.disabled = !sessionEnabled || value >= max;
    }

    function set(v) {
      v = Math.round(v / step) * step;
      v = Math.round(v * 1000) / 1000; // avoid float drift
      v = Math.min(max, Math.max(min, v));
      value = v;
      render();
      onChange(value);
    }

    decBtn.addEventListener("click", () => set(value - step));
    incBtn.addEventListener("click", () => set(value + step));

    render();
    return {
      get: () => value,
      setEnabled: (enabled) => {
        sessionEnabled = enabled;
        render();
      }
    };
  }

  let intervalSec = 5, maxDurationMin = 3, leadInSec = 3;

  const intervalStepper = makeStepper({
    containerId: "intervalStepper", displayId: "intervalValueDisplay",
    min: 5, max: 300, step: 5, decimals: 0,
    initial: stored.intervalSec || 5,
    onChange: (v) => { intervalSec = v; saveStoredSettings(); }
  });
  const durationStepper = makeStepper({
    containerId: "durationStepper", displayId: "durationValueDisplay",
    min: 0.5, max: 60, step: 0.5, decimals: 1,
    initial: stored.maxDurationMin || 1,
    onChange: (v) => { maxDurationMin = v; saveStoredSettings(); }
  });
  const leadInStepper = makeStepper({
    containerId: "leadInStepper", displayId: "leadInValueDisplay",
    min: 0, max: 15, step: 1, decimals: 0,
    initial: stored.leadInSec !== undefined ? stored.leadInSec : 3,
    onChange: (v) => { leadInSec = v; saveStoredSettings(); }
  });
  intervalSec = intervalStepper.get();
  maxDurationMin = durationStepper.get();
  leadInSec = leadInStepper.get();

  // ---------- Audio: WebAudio context, unlocked on first tap (iOS-safe) ----------
  let audioCtx = null;

  function getCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  const silentLoop = document.getElementById("silentLoop");

  // Standard iOS Safari unlock trick: must run synchronously inside a user
  // gesture. Resuming alone is not always enough on iOS/home-screen apps,
  // so we also play a near-silent buffer to fully open the audio hardware.
  function unlockAudio() {
    const ctx = getCtx();
    if (ctx.state === "suspended") ctx.resume();
    try {
      const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(ctx.destination);
      src.start(0);
    } catch (e) { /* no-op */ }
    // iOS silences the Web Audio API whenever the phone's ring/silent switch
    // is set to silent, unless an HTML media element is actively playing.
    // Starting this inaudible loop flips the page into the "playback" audio
    // category so beeps/gong are heard even with the switch on silent.
    if (silentLoop) {
      silentLoop.play().catch(() => {});
    }
    // iOS Safari gates SpeechSynthesis behind its own direct user-gesture
    // requirement, separate from Web Audio. Speaking a near-silent utterance
    // here, synchronously in the tap, "primes" it so the real announcements
    // fired later from setInterval are actually heard.
    if (window.speechSynthesis) {
      try {
        const primer = new SpeechSynthesisUtterance(" ");
        primer.volume = 0.01;
        window.speechSynthesis.speak(primer);
      } catch (e) { /* no-op */ }
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  });

  function playBeep(freq = 880, duration = 0.12, when = 0) {
    const ctx = getCtx();
    if (ctx.state === "suspended") ctx.resume();
    const t0 = ctx.currentTime + when;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.5, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  // Synthesized pleasant gong/bell using layered detuned partials + soft strike transient.
  function playGong() {
    const ctx = getCtx();
    if (ctx.state === "suspended") ctx.resume();
    const t0 = ctx.currentTime;
    const masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0.0001, t0);
    masterGain.gain.exponentialRampToValueAtTime(0.6, t0 + 0.02);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 5.5);
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = "lowpass";
    lowpass.frequency.value = 3200;
    masterGain.connect(lowpass).connect(ctx.destination);

    // Bell partials (inharmonic ratios typical of bell/gong timbre)
    const fundamental = 220;
    const partials = [1, 2.0, 2.76, 3.5, 4.2, 5.4];
    partials.forEach((ratio, i) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = fundamental * ratio;
      const amp = 0.5 / (i + 1);
      const decay = 5.0 - i * 0.5;
      g.gain.setValueAtTime(amp, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(decay, 1.2));
      osc.connect(g).connect(masterGain);
      osc.start(t0);
      osc.stop(t0 + 6);
    });

    // Soft strike transient (short filtered noise burst)
    const bufferSize = Math.floor(ctx.sampleRate * 0.15);
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "bandpass";
    noiseFilter.frequency.value = 900;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.4, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
    noise.connect(noiseFilter).connect(noiseGain).connect(masterGain);
    noise.start(t0);
  }

  // ---------- Speech: auto-pick one natural-sounding modern female voice ----------
  const FEMALE_VOICE_PRIORITY = [
    /Ava/i, /Samantha/i, /Nicky/i, /Allison/i, /Susan/i, /Zoe/i, /Serena/i, /Karen/i,
    /Google US English/i, /Google UK English Female/i,
    /Microsoft Aria/i, /Microsoft Jenny/i, /Microsoft Zira/i,
    /Female/i
  ];
  let chosenVoice = null;

  function pickBestVoice() {
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    if (!voices.length) return null;
    const enVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
    const pool = enVoices.length ? enVoices : voices;
    for (const pattern of FEMALE_VOICE_PRIORITY) {
      const match = pool.find(v => pattern.test(v.name));
      if (match) return match;
    }
    return pool[0];
  }

  function populateVoices() {
    chosenVoice = pickBestVoice();
  }
  if (window.speechSynthesis) {
    populateVoices();
    window.speechSynthesis.onvoiceschanged = populateVoices;
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    // The silent loop that keeps beeps/gong audible with the ring switch on
    // silent also fights with iOS's speech engine for the audio session —
    // pause it while speaking and resume it right after.
    const resumeLoop = () => { if (silentLoop) silentLoop.play().catch(() => {}); };
    if (silentLoop && !silentLoop.paused) silentLoop.pause();
    const utter = new SpeechSynthesisUtterance(text);
    if (chosenVoice) utter.voice = chosenVoice;
    utter.rate = 0.95;
    utter.pitch = 1.0;
    utter.onend = resumeLoop;
    utter.onerror = resumeLoop;
    window.speechSynthesis.speak(utter);
  }

  function formatAnnouncement(totalSeconds) {
    if (totalSeconds < 60) return totalSeconds + (totalSeconds === 1 ? " second" : " seconds");
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    let out = mins + (mins === 1 ? " minute" : " minutes");
    if (secs > 0) out += " " + secs + (secs === 1 ? " second" : " seconds");
    return out;
  }

  function formatClock(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  // ---------- Timer state machine ----------
  const STATE_IDLE = "idle", STATE_LEADIN = "leadin", STATE_RUNNING = "running", STATE_DONE = "done";
  let state = STATE_IDLE;
  let tickHandle = null;
  let elapsed = 0;
  let maxDurationSeconds = Math.round(maxDurationMin * 60);

  function setState(newState) {
    state = newState;
    const editable = (state === STATE_IDLE || state === STATE_DONE);
    startBtn.disabled = (state === STATE_LEADIN || state === STATE_RUNNING);
    stopBtn.disabled = (state === STATE_IDLE || state === STATE_DONE);
    intervalStepper.setEnabled(editable);
    durationStepper.setEnabled(editable);
    leadInStepper.setEnabled(editable);
  }

  function updateDisplay() {
    if (state === STATE_LEADIN) return; // clock shows countdown number separately
    clockEl.classList.remove("leadin");
    clockEl.textContent = formatClock(elapsed);
    const pct = maxDurationSeconds > 0 ? Math.min(100, (elapsed / maxDurationSeconds) * 100) : 0;
    progressBarEl.style.width = pct + "%";
  }

  function clearTick() {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  }

  function startSession() {
    // Must be the first thing that happens on the click so iOS treats the
    // whole audio pipeline as unlocked by this user gesture.
    unlockAudio();

    unlockNote.style.display = "none";
    maxDurationSeconds = Math.round(maxDurationMin * 60);
    elapsed = 0;
    progressBarEl.style.width = "0%";

    if (leadInSec > 0) {
      setState(STATE_LEADIN);
      stateLabelEl.textContent = "Get ready…";
      clockEl.classList.add("leadin");
      let count = leadInSec;
      clockEl.textContent = String(count);
      playBeep(880, 0.12);
      tickHandle = setInterval(() => {
        count -= 1;
        if (count > 0) {
          clockEl.textContent = String(count);
          playBeep(880, 0.12);
        } else {
          clearTick();
          beginRunning();
        }
      }, 1000);
    } else {
      beginRunning();
    }
  }

  function beginRunning() {
    setState(STATE_RUNNING);
    stateLabelEl.textContent = "Running";
    clockEl.classList.remove("leadin");
    elapsed = 0;
    updateDisplay();
    speak("Begin");
    tickHandle = setInterval(() => {
      elapsed += 1;
      updateDisplay();
      if (elapsed >= maxDurationSeconds) {
        clearTick();
        playGong();
        setState(STATE_DONE);
        stateLabelEl.textContent = "Complete";
        return;
      }
      if (intervalSec > 0 && elapsed % intervalSec === 0) {
        speak(formatAnnouncement(elapsed));
      }
    }, 1000);
  }

  function stopSession() {
    clearTick();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setState(STATE_IDLE);
    stateLabelEl.textContent = "Ready";
    clockEl.classList.remove("leadin");
    elapsed = 0;
    updateDisplay();
  }

  startBtn.addEventListener("click", startSession);
  stopBtn.addEventListener("click", stopSession);

  setState(STATE_IDLE);
  updateDisplay();

  // ---------- Service worker for offline use, with auto-update ----------
  // A stale cached service worker would otherwise keep serving an old
  // version of this app indefinitely. This forces any new deploy to take
  // over immediately and reload the page once.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", () => {
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              nw.postMessage({ type: "SKIP_WAITING" });
            }
          });
        });
      }).catch(() => {});
    });
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  }
})();
</script>
</body>
</html>
